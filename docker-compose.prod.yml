services:
  fja-backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: fja-backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "4002"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fja-network
      - postgres-network

networks:
  fja-network:
    external: true
  postgres-network:
    external: true
